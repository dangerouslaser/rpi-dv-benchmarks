# Lima VM for running the aarch64 build without a Pi: Debian 13 (trixie, the
# base of Raspberry Pi OS) on Apple's hypervisor. Its kernel has udmabuf, where
# the bench allocates its dmabufs off the Pi (bench/alloc.c; Docker Desktop's
# and OrbStack's kernels don't have it). The GPU is Mesa's software Vulkan,
# lavapipe, which runs the engine. Use scripts/vm-setup.sh, which fills in @REPO@
# (this checkout, mounted read-write at the same path), @CPUS@ and @MEMORY@.
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
cpus: @CPUS@
memory: @MEMORY@
disk: 40GiB
images:
  # Pinned (what the project was verified on), then the daily as a fallback.
  - location: "https://cloud.debian.org/images/cloud/trixie/20261001-2618/debian-13-genericcloud-arm64-20261001-2618.qcow2"
    arch: aarch64
    digest: "sha512:d8470b8c6c38fead046c794b5800a5a7b96672d5bcf543cc230ceb0c4b8ace05ed341a0c8928045422243fde26b2f1f2f58e99244c65709ffda2e3d4b674dd5a"
  - location: "https://cloud.debian.org/images/cloud/trixie/daily/latest/debian-13-genericcloud-arm64-daily.qcow2"
    arch: aarch64
mounts:
  - location: "@REPO@"
    mountPoint: "@REPO@"
    writable: true
mountType: virtiofs
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      # Runtime of the aarch64 build: Mesa software Vulkan, its loader, the
      # libraries dvbench (the engine is linked in) links, the
      # validation layer for tests/check.sh --validate, and tools for poking
      # around.
      apt-get install -y -qq --no-install-recommends \
        mesa-vulkan-drivers vulkan-tools libvulkan1 \
        libdrm2 libudev1 mesa-utils-bin python3 gcc libc6-dev \
        vulkan-validationlayers
      # /dev/udmabuf for every user (the bench allocates its buffers there).
      echo 'KERNEL=="udmabuf", MODE="0666"' >/etc/udev/rules.d/99-udmabuf.rules
      udevadm control --reload
      udevadm trigger --name-match=udmabuf || true
      chmod 666 /dev/udmabuf
probes:
  - description: "/dev/udmabuf usable"
    script: |
      #!/bin/bash
      set -eu
      if ! timeout 300s bash -c 'until [ -w /dev/udmabuf ]; do sleep 3; done'; then
        echo >&2 "/dev/udmabuf missing or not writable"; exit 1
      fi
    hint: "The guest kernel needs CONFIG_UDMABUF (Debian's cloud kernel has it)."
